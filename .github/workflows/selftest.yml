name: selftest
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  guard-against-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mikkokotila/Canary
          ref: main
          path: target
      - uses: actions/checkout@v4
        with:
          path: guards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - run: python -m pytest guards/guard/tests -q -p no:cacheprovider
        env:
          PR_TREE: ${{ github.workspace }}/target
